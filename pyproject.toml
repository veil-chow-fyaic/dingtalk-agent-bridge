[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dingtalk-agent-bridge"
version = "0.1.0"
description = "Runtime-neutral, local DingTalk IM bridge using official DWS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dab = "dingtalk_bridge.cli:main"
dab-bridge = "dingtalk_bridge.__main__:main"
dab-agent = "dingtalk_bridge.agent_gateway:main"
dab-consume = "dingtalk_bridge.consume:main"
dab-doctor = "dingtalk_bridge.doctor:main"
dab-service = "dingtalk_bridge.service_manager:main"

[tool.setuptools]
packages = ["dingtalk_bridge"]

[tool.setuptools.package-data]
dingtalk_bridge = ["licenses/*.txt"]
