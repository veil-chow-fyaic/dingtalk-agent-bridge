name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ['3.11', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check documentation and frozen public inventory
        run: |
          python scripts/review_documentation.py
          python scripts/verify_handoff.py
          python scripts/verify_privacy.py
      - name: Test native OpenClaw channel behavior
        run: node --test integrations/openclaw-channel/test/*.test.mjs
      - name: Run synthetic tests
        run: python scripts/run_tests_with_evidence.py
      - name: Build and install the wheel without runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps . --wheel-dir "$RUNNER_TEMP/dab-wheels"
          python -m venv "$RUNNER_TEMP/dab-installed"
          "$RUNNER_TEMP/dab-installed/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/dab-wheels/*.whl
          "$RUNNER_TEMP/dab-installed/bin/python" scripts/verify_ci_install.py
